<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>P2P калькулятор</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--tg-theme-bg-color, #ffffff);
    color: var(--tg-theme-text-color, #111111);
  }
  label {
    font-size: 13px;
    color: var(--tg-theme-hint-color, #888888);
    display: block;
    margin-bottom: 4px;
  }
  input, select, button {
    font-family: inherit;
    font-size: 15px;
    border-radius: 8px;
    border: 1px solid var(--tg-theme-hint-color, #d0d0d0);
    background: var(--tg-theme-secondary-bg-color, #f5f5f5);
    color: var(--tg-theme-text-color, #111111);
    height: 40px;
    padding: 0 10px;
  }
  input[type="checkbox"] { height: auto; width: 18px; padding: 0; }
  .row { display: flex; gap: 8px; margin-bottom: 12px; align-items: flex-end; }
  .row > div { flex: 1; min-width: 0; }
  .settings-row { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  #addBtn {
    width: 40px; height: 40px; padding: 0; flex-shrink: 0;
    background: var(--tg-theme-button-color, #2481cc);
    color: var(--tg-theme-button-text-color, #ffffff);
    border: none; font-size: 20px; line-height: 1;
  }
  #list { display: flex; flex-direction: column; gap: 0; margin: 16px 0; }
  .trade-row {
    display: flex; align-items: center; gap: 8px; padding: 10px 0;
    border-bottom: 1px solid var(--tg-theme-hint-color, #e5e5e5);
    font-size: 14px;
  }
  .trade-row .desc { flex: 1; }
  .trade-row .net { color: var(--tg-theme-hint-color, #888888); }
  .delBtn {
    width: 28px; height: 28px; padding: 0; border: none; background: transparent;
    color: var(--tg-theme-hint-color, #888888); font-size: 18px; flex-shrink: 0;
  }
  .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .metric {
    background: var(--tg-theme-secondary-bg-color, #f5f5f5);
    border-radius: 10px; padding: 12px;
  }
  .metric .label { font-size: 12px; color: var(--tg-theme-hint-color, #888888); }
  .metric .value { font-size: 20px; font-weight: 600; margin-top: 2px; }
  #resetBtn {
    width: 100%; background: transparent; color: var(--tg-theme-destructive-text-color, #cc3333);
  }
  #err { font-size: 13px; color: #cc3333; display: none; margin-bottom: 10px; }
</style>
</head>
<body>

<div class="row">
  <div>
    <label>Комиссия продажи, %</label>
    <input type="number" id="sellFee" value="0.9" step="0.1" style="width:100%">
  </div>
  <div>
    <label>Комиссия перевода, %</label>
    <input type="number" id="buyFee" value="0.5" step="0.1" style="width:100%">
  </div>
</div>
<div class="settings-row">
  <input type="checkbox" id="capOn">
  <label for="capOn" style="margin:0">Потолок комиссии перевода, ₽</label>
  <input type="number" id="capVal" value="1500" step="50" style="width:80px" disabled>
</div>

<div class="row">
  <div style="flex:1">
    <label>Тип</label>
    <select id="tType" style="width:100%">
      <option value="sell">Продажа</option>
      <option value="buy">Покупка</option>
    </select>
  </div>
  <div style="flex:1.3">
    <label>Сумма</label>
    <div style="display:flex; gap:4px">
      <input type="number" id="tAmount" step="0.01" placeholder="100" style="flex:1; min-width:0">
      <select id="tCur" style="width:56px; flex-shrink:0">
        <option value="usd">$</option>
        <option value="rub">₽</option>
      </select>
    </div>
  </div>
  <div style="flex:1">
    <label>Курс, ₽</label>
    <input type="number" id="tRate" step="0.01" placeholder="98.5" style="width:100%">
  </div>
  <button id="addBtn" aria-label="Добавить">+</button>
</div>
<div id="err"></div>

<div id="list"></div>

<div class="metrics">
  <div class="metric"><div class="label">Прибыль за день</div><div class="value" id="mProfit">0 ₽</div></div>
  <div class="metric"><div class="label">Спред, ₽/$</div><div class="value" id="mSpread">–</div></div>
  <div class="metric"><div class="label">Продано, $</div><div class="value" id="mSold">0</div></div>
  <div class="metric"><div class="label">Куплено, $</div><div class="value" id="mBought">0</div></div>
</div>

<button id="resetBtn">Очистить журнал</button>

<script>
if (window.Telegram && window.Telegram.WebApp) {
  Telegram.WebApp.ready();
  Telegram.WebApp.expand();
}

let trades = JSON.parse(localStorage.getItem('p2p_trades') || '[]');
const settings = JSON.parse(localStorage.getItem('p2p_settings') || 'null');
if (settings) {
  document.getElementById('sellFee').value = settings.sellFee;
  document.getElementById('buyFee').value = settings.buyFee;
  document.getElementById('capOn').checked = settings.capOn;
  document.getElementById('capVal').value = settings.capVal;
  document.getElementById('capVal').disabled = !settings.capOn;
}

const fmtRub = n => Math.round(n).toLocaleString('ru-RU') + ' \u20bd';
const fmtUsd = n => (Math.round(n * 100) / 100).toLocaleString('ru-RU');

function saveTrades() { localStorage.setItem('p2p_trades', JSON.stringify(trades)); }
function saveSettings() {
  const cfg = {
    sellFee: parseFloat(document.getElementById('sellFee').value) || 0,
    buyFee: parseFloat(document.getElementById('buyFee').value) || 0,
    capOn: document.getElementById('capOn').checked,
    capVal: parseFloat(document.getElementById('capVal').value) || 0
  };
  localStorage.setItem('p2p_settings', JSON.stringify(cfg));
}

function computeTrade(tr) {
  const sellFee = parseFloat(document.getElementById('sellFee').value) || 0;
  const buyFee = parseFloat(document.getElementById('buyFee').value) || 0;
  const capOn = document.getElementById('capOn').checked;
  const capVal = parseFloat(document.getElementById('capVal').value) || 0;
  const rub = tr.amount * tr.rate;
  if (tr.type === 'sell') {
    const fee = rub * (sellFee / 100);
    return { fee, net: rub - fee };
  } else {
    let fee = rub * (buyFee / 100);
    if (capOn && fee > capVal) fee = capVal;
    return { fee, net: rub + fee };
  }
}

function render() {
  const list = document.getElementById('list');
  list.innerHTML = '';
  let profit = 0, sold = 0, bought = 0;
  let sellRubSum = 0, sellUsdSum = 0, buyRubSum = 0, buyUsdSum = 0;
  trades.forEach((tr, i) => {
    const c = computeTrade(tr);
    if (tr.type === 'sell') { profit += c.net; sold += tr.amount; sellRubSum += tr.rate * tr.amount; sellUsdSum += tr.amount; }
    else { profit -= c.net; bought += tr.amount; buyRubSum += tr.rate * tr.amount; buyUsdSum += tr.amount; }
    const row = document.createElement('div');
    row.className = 'trade-row';
    const arrow = tr.type === 'sell' ? '↗' : '↙';
    row.innerHTML = '<span>' + arrow + '</span>' +
      '<span class="desc">' + (tr.type === 'sell' ? 'Продажа' : 'Покупка') + ' ' + fmtUsd(tr.amount) + ' $ @ ' + fmtUsd(tr.rate) + '</span>' +
      '<span class="net">' + fmtRub(c.net) + '</span>' +
      '<button class="delBtn" data-i="' + i + '">×</button>';
    list.appendChild(row);
  });
  document.querySelectorAll('.delBtn').forEach(b => {
    b.onclick = () => { trades.splice(parseInt(b.dataset.i), 1); saveTrades(); render(); };
  });
  document.getElementById('mProfit').textContent = fmtRub(profit);
  document.getElementById('mSold').textContent = fmtUsd(sold);
  document.getElementById('mBought').textContent = fmtUsd(bought);
  const spreadEl = document.getElementById('mSpread');
  if (sellUsdSum > 0 && buyUsdSum > 0) {
    const avgSell = sellRubSum / sellUsdSum;
    const avgBuy = buyRubSum / buyUsdSum;
    spreadEl.textContent = (Math.round((avgSell - avgBuy) * 100) / 100).toLocaleString('ru-RU') + ' \u20bd';
  } else {
    spreadEl.textContent = '–';
  }
}

document.getElementById('capOn').addEventListener('change', e => {
  document.getElementById('capVal').disabled = !e.target.checked;
  saveSettings(); render();
});
['sellFee','buyFee','capVal'].forEach(id => {
  document.getElementById(id).addEventListener('input', () => { saveSettings(); render(); });
});

document.getElementById('addBtn').addEventListener('click', () => {
  const type = document.getElementById('tType').value;
  const cur = document.getElementById('tCur').value;
  const rawAmount = parseFloat(document.getElementById('tAmount').value);
  const rate = parseFloat(document.getElementById('tRate').value);
  const err = document.getElementById('err');
  if (!rawAmount || rawAmount <= 0 || !rate || rate <= 0) {
    err.textContent = 'Укажи сумму и курс больше нуля';
    err.style.display = 'block';
    return;
  }
  err.style.display = 'none';
  const amount = cur === 'rub' ? rawAmount / rate : rawAmount;
  trades.push({ type, amount, rate });
  saveTrades();
  document.getElementById('tAmount').value = '';
  document.getElementById('tRate').value = '';
  render();
});

document.getElementById('resetBtn').addEventListener('click', () => {
  trades = [];
  saveTrades();
  render();
});

render();
</script>
</body>
</html>
